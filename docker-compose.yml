# Local development services for HOWLOW.
#
#   docker compose up -d
#
# Application processes (API, worker, web) run on the host via `npm run dev`
# so that reloads are fast; this file provides only the backing services.

name: howlow

services:
  postgres:
    image: postgres:16-alpine
    container_name: howlow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: howlow
      POSTGRES_PASSWORD: howlow
      POSTGRES_DB: howlow
      # Deterministic collation so ordering matches production.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U howlow -d howlow']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: howlow-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: howlow-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: howlow-local-access-key
      MINIO_ROOT_PASSWORD: howlow-local-secret-key
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the development bucket once MinIO is healthy, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: howlow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 howlow-local-access-key howlow-local-secret-key &&
        mc mb --ignore-existing local/howlow-dev &&
        mc anonymous set download local/howlow-dev
    restart: on-failure

  # Mailpit rather than MailHog: MailHog was archived in 2020 and its published
  # image declares a USER whose passwd entry is missing, so the container cannot
  # be created ("unable to find user mailhog"). Mailpit is its maintained
  # successor and keeps the same ports, so nothing else changes.
  mailpit:
    image: axllent/mailpit:latest
    container_name: howlow-mailpit
    restart: unless-stopped
    environment:
      # Development inbox: accept anything, so application code never needs
      # environment-specific SMTP credentials.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 5000
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  redis-data:
  minio-data:
