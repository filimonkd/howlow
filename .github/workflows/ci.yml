name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: howlow
          POSTGRES_PASSWORD: howlow
          POSTGRES_DB: howlow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U howlow -d howlow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://howlow:howlow@localhost:5432/howlow_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-value-that-is-long-enough-000
      SESSION_SECRET: ci-only-session-secret-value-that-is-long-enough
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # Type-aware lint rules and the architecture test resolve types across
      # workspaces, so the declarations have to exist first.
      - name: Build workspace types
        run: npm run build:types

      - name: Lint (includes architecture boundary rules)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Apply migrations to an empty database
        run: npm run migrate

      - name: Verify schema (tables, indexes, constraints, triggers, money types)
        run: npm run db:verify

      - name: Verify migrations roll back and re-apply cleanly
        run: |
          npx node-pg-migrate -m migrations -j sql down 999
          npm run migrate
          npm run db:verify

      - name: Seed development data
        run: npm run seed

      - name: Database constraint tests
        run: npm run test:db

      - name: Verify API boots and reports healthy
        run: node scripts/smoke.mjs

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
